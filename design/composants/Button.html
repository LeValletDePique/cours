<!doctype html>
<html lang="fr">
<head>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../mes-cours.css">
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>body{padding:24px}</style>
</head>
<body>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
<button class="mc-btn mc-btn--primary"><svg class="lucide mc-ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 20h9" /><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /></svg>Prendre des notes<span class="mc-kbd">N</span></button>
<button class="mc-btn"><svg class="lucide mc-ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></svg>Reprendre</button>
<button class="mc-btn mc-btn--ghost">Annuler</button>
<button class="mc-btn mc-btn--sm"><svg class="lucide mc-ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 12h14" /><path d="M12 5v14" /></svg>Notes</button>
<button class="mc-btn mc-btn--primary mc-btn--lg">Prendre des notes</button>
</div>
</body>
</html>
