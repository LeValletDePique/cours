<!doctype html>
<html lang="fr">
<head>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../mes-cours.css">
<meta charset="utf-8">
<title>TaskList</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>body{padding:24px;max-width:460px}</style>
</head>
<body>
<section class="mc-card" aria-label="À faire">
  <div class="mc-card__head"><h3 class="mc-h">À faire</h3><span class="mc-meta">2 ouvertes</span></div>
  <label class="mc-quickadd"><svg class="lucide mc-ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 12h14" /><path d="M12 5v14" /></svg><input placeholder="Ajouter une tâche…"><span class="mc-kbd">T</span></label>
  <ul class="mc-tasks">
    <li class="mc-task mc-ue-2"><input type="checkbox" class="mc-check" aria-label="Terminer"><div><div class="mc-task__text">Finir TD1 – entités / associations</div><div class="mc-task__meta"><span class="mc-dot"></span>Base de données · <span class="mc-when mc-when--soon">demain</span></div></div></li>
    <li class="mc-task mc-ue-2"><input type="checkbox" class="mc-check" aria-label="Terminer"><div><div class="mc-task__text">Relire TP2 – Les entrées / sorties</div><div class="mc-task__meta"><span class="mc-dot"></span>Unix et Architecture · <span class="mc-when">ven. 2</span></div></div></li>
    <li class="mc-task mc-task--done mc-ue-autre"><input type="checkbox" class="mc-check" checked aria-label="Rouvrir"><div><div class="mc-task__text">Classer la note DIDANG1D</div><div class="mc-task__meta">Fait à 09:12</div></div></li>
  </ul>
</section>
</body>
</html>
