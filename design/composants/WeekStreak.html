<!doctype html>
<html lang="fr">
<head>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../mes-cours.css">
<meta charset="utf-8">
<title>WeekStreak</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>body{padding:24px;max-width:380px}</style>
</head>
<body>
<section class="mc-card mc-streak" aria-label="Ta semaine">
  <p class="mc-eyebrow">Ta semaine</p>
  <div><div class="mc-numeral">3 jours</div><div class="mc-muted" style="font-size:14px">de suite avec des notes</div></div>
  <div class="mc-week">
    <div class="mc-day mc-day--done"><b class="mc-day__cell"></b>L</div>
    <div class="mc-day mc-day--done"><b class="mc-day__cell"></b>M</div>
    <div class="mc-day mc-day--done mc-day--today"><b class="mc-day__cell"></b>M</div>
    <div class="mc-day"><b class="mc-day__cell"></b>J</div>
    <div class="mc-day"><b class="mc-day__cell"></b>V</div>
    <div class="mc-day"><b class="mc-day__cell"></b>S</div>
    <div class="mc-day"><b class="mc-day__cell"></b>D</div>
  </div>
  <div class="mc-goal">
    <div class="mc-goal__row"><span>Cours notés aujourd'hui</span><b>1 / 4</b></div>
    <div class="mc-progress"><span style="width:25%"></span></div>
  </div>
</section>
</body>
</html>
