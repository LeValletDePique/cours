<!doctype html>
<html lang="fr">
<head>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../mes-cours.css">
<meta charset="utf-8">
<title>CommandPalette</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>body{padding:24px}</style>
</head>
<body>
<div style="display:grid;gap:20px;justify-items:start">
<div class="mc-search"><svg class="lucide mc-ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>Rechercher une note, une matière…<span class="mc-kbd">Ctrl K</span></div>
<div class="mc-palette" role="dialog" aria-label="Palette de commandes">
  <div class="mc-palette__input"><svg class="lucide " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg><span>entit</span><span class="mc-caret"></span></div>
  <div class="mc-palette__group"><p class="mc-eyebrow mc-palette__label">Notes</p>
    <div class="mc-palette__item mc-ue-2" aria-selected="true"><span class="mc-dot"></span>TD1 - les <mark>entit</mark>és - associations<span class="mc-meta">Base de données</span></div>
    <div class="mc-palette__item mc-ue-3"><span class="mc-dot"></span>Gestion de l'<mark>entr</mark>eprise I (TD) – 30/09<span class="mc-meta">Gestion de l'entreprise I</span></div>
  </div>
  <div class="mc-palette__group"><p class="mc-eyebrow mc-palette__label">Actions</p>
    <div class="mc-palette__item"><svg class="lucide mc-ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 12h14" /><path d="M12 5v14" /></svg>Nouvelle note<span class="mc-kbd" style="margin-left:auto">N</span></div>
    <div class="mc-palette__item"><svg class="lucide mc-ico-sm" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></svg>Ajouter une tâche<span class="mc-kbd" style="margin-left:auto">T</span></div>
  </div>
</div></div>
</body>
</html>
